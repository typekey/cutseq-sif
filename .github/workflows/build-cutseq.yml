# Build the cutseq image and push it to GHCR.
#
# No secrets to configure: GITHUB_TOKEN is provided automatically and
# `packages: write` is all the permission pushing to ghcr.io needs.
#
# AFTER THE FIRST SUCCESSFUL RUN, make the package public once:
#   https://github.com/users/typekey/packages/container/cutseq/settings
#   -> Danger Zone -> Change visibility -> Public
# Otherwise Singularity on the cluster cannot pull it anonymously.
#
# Resulting image:
#   ghcr.io/typekey/cutseq:0.0.68   and   :latest
# Pull from Singularity with:
#   singularity pull docker://ghcr.io/typekey/cutseq:0.0.68

name: build cutseq container

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-cutseq.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: typekey/cutseq
  CUTSEQ_VERSION: 0.0.68

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # linux/amd64 only: the cutadapt manylinux wheels this image relies
          # on are x86_64, and the cluster is x86_64. Adding linux/arm64 would
          # force a source build and needs build-essential in the Dockerfile.
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.CUTSEQ_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the pushed image
        run: |
          IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.CUTSEQ_VERSION }}
          docker run --rm "$IMG" cutseq --version
          docker run --rm "$IMG" cutseq --list-adapters | grep '^INLINE'
          # the pipeline invokes it as a plain command, so confirm PATH resolution
          docker run --rm "$IMG" which cutseq
